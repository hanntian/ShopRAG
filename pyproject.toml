[project]
name = "deepresearch-stack"
version = "0.1.0"
description = "Observable Retrieval System for ML Research and Technical Knowledge."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp",
    "arxiv",
    "beautifulsoup4",
    "datasets>=4.5.0",
    "fastapi",
    "gradio",
    "langchain",
    "langchain-text-splitters",
    "openai",
    "pyarrow>=21.0.0",
    "python-dotenv",
    "qdrant-client",
    "rank-bm25",
    "redis>=5.0",
    "requests",
    "sentence-transformers",
    "tqdm",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
]
evals = [
    "langfuse",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["evals/tests"]
pythonpath = ["."]
